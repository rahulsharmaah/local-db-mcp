[project]
name = "local-db-mcp"
version = "0.1.0"
description = "Local MCP server for querying configured SQL and NoSQL databases from Codex, Claude, and Cursor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "pymongo>=4.8,<5",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
local-db-mcp = "local_db_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
